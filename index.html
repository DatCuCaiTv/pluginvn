<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>My Bio</title>

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;700&display=swap" rel="stylesheet">

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:Poppins,sans-serif;
}

body{
    background:linear-gradient(135deg,#4f46e5,#9333ea,#ec4899);
    background-size:300% 300%;
    animation:bg 10s infinite alternate;
    display:flex;
    justify-content:center;
    align-items:center;
    min-height:100vh;
    padding:20px;
}

@keyframes bg{
    0%{background-position:left;}
    100%{background-position:right;}
}

.card{
    width:100%;
    max-width:430px;
    background:rgba(255,255,255,.12);
    backdrop-filter:blur(20px);
    border:1px solid rgba(255,255,255,.2);
    border-radius:30px;
    padding:30px;
    color:white;
    text-align:center;
    box-shadow:0 15px 40px rgba(0,0,0,.25);
}

.avatar{
    width:120px;
    height:120px;
    border-radius:50%;
    border:5px solid white;
    object-fit:cover;
}

h1{
    margin-top:15px;
}

p{
    opacity:.8;
    margin-top:5px;
}

.stats{
    display:flex;
    justify-content:space-around;
    margin:25px 0;
}

.stats div{
    display:flex;
    flex-direction:column;
}

.stats span:first-child{
    font-size:22px;
    font-weight:bold;
}

.link{
    display:flex;
    align-items:center;
    justify-content:center;
    gap:10px;
    width:100%;
    padding:15px;
    margin:12px 0;
    text-decoration:none;
    color:white;
    border-radius:18px;
    background:rgba(255,255,255,.15);
    transition:.3s;
    font-weight:600;
}

.link:hover{
    transform:translateY(-4px) scale(1.02);
    background:white;
    color:#6d28d9;
}

.footer{
    margin-top:20px;
    opacity:.7;
    font-size:13px;
}

.toggle{
    margin-top:20px;
    cursor:pointer;
    background:white;
    color:#6d28d9;
    border:none;
    padding:10px 20px;
    border-radius:50px;
    font-weight:bold;
}

.dark{
    background:#111827;
}

.dark .card{
    background:rgba(17,24,39,.8);
}

.dark .toggle{
    background:#6366f1;
    color:white;
}
</style>

</head>
<body>

<div class="card">

<img class="avatar"
src="https://i.pravatar.cc/300"
alt="avatar">

<h1>@yourname</h1>

<p>🚀 Developer • Designer • Content Creator</p>

<div class="stats">
<div>
<span>12K</span>
<small>Followers</small>
</div>

<div>
<span>96</span>
<small>Projects</small>
</div>

<div>
<span>1.2M</span>
<small>Views</small>
</div>
</div>

<a class="link" href="#">
🎥 TikTok
</a>

<a class="link" href="#">
📸 Instagram
</a>

<a class="link" href="#">
▶ YouTube
</a>

<a class="link" href="#">
💻 GitHub
</a>

<a class="link" href="#">
🌐 Website
</a>

<button class="toggle" onclick="darkMode()">
🌙 Dark Mode
</button>

<div class="footer">
Made with ❤️
</div>

</div>

<script>

function darkMode(){
document.body.classList.toggle("dark");
}

</script>

</body>
</html>
